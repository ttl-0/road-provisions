name: Build Foundry Release

on:
  push:
    branches:
      - main
    paths:
      - "module.json"

  # Still allows you to manually run it if necessary.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Get version directly from module.json
      # ------------------------------------------------------------

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.version' module.json)"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "module.json does not contain a version."
            exit 1
          fi

          echo "Building Road Provisions v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Make sure we aren't trying to publish the same version twice
      # ------------------------------------------------------------

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "Increment the version in module.json before releasing."
            exit 1
          fi

      # ------------------------------------------------------------
      # Build release manifest
      # ------------------------------------------------------------

      - name: Build release manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          MANIFEST_URL="${REPO_URL}/releases/latest/download/module.json"
          DOWNLOAD_URL="${REPO_URL}/releases/download/v${VERSION}/road-provisions-v${VERSION}.zip"

          mkdir -p dist/package

          jq \
            --arg version "$VERSION" \
            --arg url "$REPO_URL" \
            --arg manifest "$MANIFEST_URL" \
            --arg download "$DOWNLOAD_URL" \
            '
              .version = $version |
              .url = $url |
              .manifest = $manifest |
              .download = $download
            ' \
            module.json > dist/package/module.json

      # ------------------------------------------------------------
      # Copy module contents
      # ------------------------------------------------------------

      - name: Assemble module
        shell: bash
        run: |
          cp -R scripts dist/package/scripts
          cp -R styles dist/package/styles
          cp -R templates dist/package/templates

          if [ -d lang ]; then
            cp -R lang dist/package/lang
          fi

          if [ -d assets ]; then
            cp -R assets dist/package/assets
          fi

          if [ -d packs ]; then
            cp -R packs dist/package/packs
          fi

          if [ -f README.md ]; then
            cp README.md dist/package/README.md
          fi

          if [ -f LICENSE ]; then
            cp LICENSE dist/package/LICENSE
          fi

          if [ -f LICENSE.md ]; then
            cp LICENSE.md dist/package/LICENSE.md
          fi

      # ------------------------------------------------------------
      # Create Foundry module ZIP
      # ------------------------------------------------------------

      - name: Build ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cd dist/package

          zip -r \
            "../road-provisions-v${VERSION}.zip" \
            .

          cd ..

          cp package/module.json module.json

          echo "Built:"
          ls -lah

      # ------------------------------------------------------------
      # Publish GitHub release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          gh release create "$TAG" \
            "dist/module.json" \
            "dist/road-provisions-v${VERSION}.zip" \
            --title "Road Provisions v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --latest
