name: Build Foundry Release

on:
  push:
    branches:
      - main

  # Also lets you manually trigger a release from GitHub if desired.
  workflow_dispatch:

permissions:
  contents: write

# Prevent two rapid pushes from trying to create the same version.
concurrency:
  group: foundry-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Determine next version
      #
      # If module.json says 1.1.0:
      #
      #   no existing releases -> 1.1.1
      #   latest v1.1.1      -> 1.1.2
      #   latest v1.1.2      -> 1.1.3
      #
      # If you later change module.json to 1.2.0, releases switch to
      # the v1.2.x series automatically.
      # ------------------------------------------------------------------

      - name: Determine next version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(jq -r '.version' module.json)"

          MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
          BASE_PATCH="$(echo "$BASE_VERSION" | cut -d. -f3 | sed 's/[^0-9].*$//')"

          echo "Base version: $BASE_VERSION"
          echo "Searching existing v${MAJOR}.${MINOR}.x tags..."

          LATEST_PATCH="$(
            git tag --list "v${MAJOR}.${MINOR}.*" \
              | sed -En "s/^v${MAJOR}\.${MINOR}\.([0-9]+)$/\1/p" \
              | sort -n \
              | tail -1
          )"

          if [ -z "$LATEST_PATCH" ]; then
            LATEST_PATCH="$BASE_PATCH"
          fi

          NEXT_PATCH=$((LATEST_PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "Building version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Build release-specific module.json
      # ------------------------------------------------------------------

      - name: Build release manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          MANIFEST_URL="${REPO_URL}/releases/latest/download/module.json"
          DOWNLOAD_URL="${REPO_URL}/releases/download/v${VERSION}/road-provisions-v${VERSION}.zip"

          mkdir -p dist/package

          jq \
            --arg version "$VERSION" \
            --arg url "$REPO_URL" \
            --arg manifest "$MANIFEST_URL" \
            --arg download "$DOWNLOAD_URL" \
            '
              .version = $version |
              .url = $url |
              .manifest = $manifest |
              .download = $download
            ' \
            module.json > dist/package/module.json

          echo "Generated manifest:"
          cat dist/package/module.json

      # ------------------------------------------------------------------
      # Copy module contents
      #
      # Add another directory here later if the module gains things like:
      # lang/, assets/, packs/, etc.
      # ------------------------------------------------------------------

      - name: Assemble module
        shell: bash
        run: |
          cp -R scripts dist/package/scripts
          cp -R styles dist/package/styles
          cp -R templates dist/package/templates

          if [ -f README.md ]; then
            cp README.md dist/package/README.md
          fi

          if [ -f LICENSE ]; then
            cp LICENSE dist/package/LICENSE
          fi

          if [ -f LICENSE.md ]; then
            cp LICENSE.md dist/package/LICENSE.md
          fi

      # ------------------------------------------------------------------
      # Zip contents at archive root.
      #
      # Opening the ZIP will show:
      #
      # module.json
      # scripts/
      # styles/
      # templates/
      #
      # rather than another unnecessary road-provisions/ directory.
      # ------------------------------------------------------------------

      - name: Build ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cd dist/package

          zip -r \
            "../road-provisions-v${VERSION}.zip" \
            .

          cd ..

          # We also upload module.json separately because Foundry uses it
          # as the stable installation/update manifest.
          cp package/module.json module.json

          echo "Release contents:"
          ls -lah

      # ------------------------------------------------------------------
      # Create the GitHub Release
      # ------------------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          gh release create "$TAG" \
            "dist/module.json" \
            "dist/road-provisions-v${VERSION}.zip" \
            --title "Road Provisions v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --latest
